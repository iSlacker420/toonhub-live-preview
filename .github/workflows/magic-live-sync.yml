name: MAGIC SCANNER LIVE 2.0 — sync reviewed LIVE to QA
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: magic-live-qa-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: preview
          persist-credentials: true
      - name: Check private read-only token
        env:
          TOKEN: ${{ secrets.TOONHUB_SCANNER_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo '::error::Set TOONHUB_SCANNER_READ_TOKEN (read-only access to private toonhub.tv repository)'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: iSlacker420/toonhub.tv
          ref: feature/worldwide-country-filter-20261110
          token: ${{ secrets.TOONHUB_SCANNER_READ_TOKEN }}
          path: scanner
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: iSlacker420/toonhub.tv
          ref: data/magic-scanner-registry
          token: ${{ secrets.TOONHUB_SCANNER_READ_TOKEN }}
          path: metadata
          persist-credentials: false
      - name: Export country-filtered LIVE from existing scheduled scanner snapshot
        run: node scanner/scripts/export-worldwide-live.mjs metadata/data/cartoon-library.json scanner/data/trusted-sources.json PL "$RUNNER_TEMP/approved-live.json"
      - name: Merge only rights-reviewed streams into public QA metadata
        run: node preview/scripts/merge-approved-live.mjs "$RUNNER_TEMP/approved-live.json" preview/qa/live-registry.json
      - name: Commit QA metadata only if changed
        working-directory: preview
        run: |
          set -euo pipefail
          if git diff --quiet -- qa/live-registry.json; then
            echo 'No new approved LIVE; public QA remains unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- qa/live-registry.json
          git commit -m 'data(qa): refresh approved LIVE from MAGIC SCANNER [skip ci]'
          git push origin HEAD:main
