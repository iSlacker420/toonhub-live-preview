name: Sync MAGIC SCANNER JSON to iPhone QA
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worldwide-json-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MAGIC SCANNER exporter (read-only)
        uses: actions/checkout@v4
        with:
          repository: iSlacker420/toonhub.tv
          ref: feature/worldwide-country-filter-20261110
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          path: scanner-source
          persist-credentials: false
      - name: Checkout current MAGIC SCANNER registry snapshot (read-only)
        uses: actions/checkout@v4
        with:
          repository: iSlacker420/toonhub.tv
          ref: data/magic-scanner-registry
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          path: scanner-snapshot
          persist-credentials: false
      - name: Export reviewed LIVE/VOD from current registry
        run: |
          node scanner-source/scripts/export-worldwide-live.mjs \
            scanner-snapshot/data/cartoon-library.json \
            scanner-source/data/trusted-sources.json \
            PL /tmp/worldwide-live-PL.json
      - name: Add public embeddable YouTube LIVE from FAST CHECK
        run: |
          if [ -f scanner-snapshot/data/cartoonstv-discovery-results.json ]; then
            node scanner-source/scripts/export-public-live-qa.mjs scanner-snapshot/data/cartoonstv-discovery-results.json PL /tmp/public-live.json
            node --input-type=module <<'JS'
          import fs from 'node:fs'
          const p='/tmp/worldwide-live-PL.json'
          const x=JSON.parse(fs.readFileSync(p,'utf8'))
          const incoming=JSON.parse(fs.readFileSync('/tmp/public-live.json','utf8'))
          const existing=new Set(x.items.map(v=>v.videoId||v.id))
          for(const v of incoming.items)if(!existing.has(v.videoId)){x.items.unshift(v);existing.add(v.videoId)}
          x.liveCount=x.items.filter(v=>v.sourceType==='live').length
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\\n')
          JS
          fi
      - name: Add explicitly licensed QA-only VOD fallback (never LIVE)
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const p='/tmp/worldwide-live-PL.json'
          const x=JSON.parse(fs.readFileSync(p,'utf8'))
          const registry=JSON.parse(fs.readFileSync('scanner-snapshot/data/cartoon-library.json','utf8'))
          const trusted=JSON.parse(fs.readFileSync('scanner-source/data/trusted-sources.json','utf8'))
          const approved=new Set(['w3c-big-buck-bunny','w3c-sintel-trailer'])
          const now=new Date().toISOString()
          const candidates=registry.videos.filter(v=>approved.has(v.sourceId)&&v.provider==='html5'&&v.kind==='demo'&&v.sourceType==='video'&&v.status==='available'&&v.embeddable===true)
          for(const v of candidates){
            const src=trusted.find(s=>s.id===v.sourceId)
            if(!src||src.approval!=='approved-demo'||src.license!=='CC BY 3.0'||src.licenseUrl!=='https://creativecommons.org/licenses/by/3.0/'||!src.urls?.some(u=>u.id===v.id&&u.src===v.src))continue
            if(!v.src?.startsWith('https://media.w3.org/'))continue
            // Check that media endpoint still responds before making it visible in QA.
            let available=false
            try{
              const response=await fetch(v.src,{method:'HEAD',signal:AbortSignal.timeout(10000)})
              available=response.ok
            }catch{}
            if(!available){console.log('QA demo unreachable:',v.id);continue}
            if(x.items.some(item=>item.id===v.id))continue
            x.items.push({...v,rightsReviewed:true,rightsEvidenceUrl:src.licenseUrl,embedAllowed:true,regionStatus:'allowed',allowedCountries:['PL'],ageRating:'all',lastCheckedAt:now,qaOnly:true,qaLicenseBasis:src.sourcePage})
          }
          x.items.sort((a,b)=>(a.sourceType==='live'?0:1)-(b.sourceType==='live'?0:1))
          x.liveCount=x.items.filter(v=>v.sourceType==='live').length
          x.fallbackCount=x.items.filter(v=>v.sourceType==='video').length
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n')
          console.log('QA eligible LIVE:',x.liveCount,'VOD:',x.fallbackCount)
          JS
      - name: Apply central rights blocklist before publishing
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const p='/tmp/worldwide-live-PL.json'
          const x=JSON.parse(fs.readFileSync(p,'utf8'))
          const rules=JSON.parse(fs.readFileSync('rights-registry.json','utf8'))
          if(rules.version!==1||!Array.isArray(rules.blockedSourceIds)||!Array.isArray(rules.blockedVideoIds)||!Array.isArray(rules.blockedDomains))throw Error('Invalid rights registry; fail closed')
          const sources=new Set(rules.blockedSourceIds)
          const videos=new Set(rules.blockedVideoIds)
          const domains=new Set(rules.blockedDomains.map(s=>s.toLowerCase()))
          x.items=x.items.filter(v=>{
            if(sources.has(v.sourceId)||videos.has(v.id)||videos.has(v.videoId))return false
            try{
              const u=new URL(v.src||v.sourcePage||'https://www.youtube.com/')
              if(domains.has(u.hostname.toLowerCase()))return false
            }catch{return false}
            return true
          })
          x.liveCount=x.items.filter(v=>v.sourceType==='live').length
          x.fallbackCount=x.items.filter(v=>v.sourceType==='video').length
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n')
          console.log('Rights-filtered LIVE:',x.liveCount,'VOD:',x.fallbackCount)
          JS
      - name: Validate metadata-only export before publishing
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const x=JSON.parse(fs.readFileSync('/tmp/worldwide-live-PL.json','utf8'))
          if(x.country!=='PL'||x.ephemeral!==true||x.mediaStored!==false||!Array.isArray(x.items)||x.items.length>1000)process.exit(1)
          if(x.items.some(v=>v.rightsReviewed!==true||v.embedAllowed!==true||v.embeddable!==true||v.regionStatus!=='allowed'||v.status!=='available'||typeof v.rightsEvidenceUrl!=='string'||!v.rightsEvidenceUrl.startsWith('https://')))process.exit(1)
          if(x.items.some((v,i)=>v.sourceType==='live'&&x.items.slice(0,i).some(p=>p.sourceType==='video')))process.exit(1)
          console.log('Verified LIVE/VOD records:',x.items.length)
          JS
      - name: Publish JSON to QA Pages repository
        run: |
          cp /tmp/worldwide-live-PL.json worldwide-live-PL.json
          if git diff --quiet -- worldwide-live-PL.json && git ls-files --error-unmatch worldwide-live-PL.json >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worldwide-live-PL.json
          git commit -m 'data(qa): sync reviewed WORLDWIDE LIVE/VOD metadata'
          git push
