name: Sync MAGIC SCANNER JSON to iPhone QA
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worldwide-json-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MAGIC SCANNER exporter (read-only)
        uses: actions/checkout@v4
        with:
          repository: iSlacker420/toonhub.tv
          ref: feature/worldwide-country-filter-20261110
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          path: scanner-source
          persist-credentials: false
      - name: Checkout current MAGIC SCANNER registry snapshot (read-only)
        uses: actions/checkout@v4
        with:
          repository: iSlacker420/toonhub.tv
          ref: data/magic-scanner-registry
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          path: scanner-snapshot
          persist-credentials: false
      - name: Export reviewed LIVE/VOD from current registry
        run: |
          node scanner-source/scripts/export-worldwide-live.mjs \
            scanner-snapshot/data/cartoon-library.json \
            scanner-source/data/trusted-sources.json \
            PL /tmp/worldwide-live-PL.json
      - name: Validate metadata-only export before publishing
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const x=JSON.parse(fs.readFileSync('/tmp/worldwide-live-PL.json','utf8'))
          if(x.country!=='PL'||x.ephemeral!==true||x.mediaStored!==false||!Array.isArray(x.items)||x.items.length>1000)process.exit(1)
          if(x.items.some(v=>v.rightsReviewed!==true||v.embedAllowed!==true||v.embeddable!==true||v.regionStatus!=='allowed'||v.status!=='available'||typeof v.rightsEvidenceUrl!=='string'||!v.rightsEvidenceUrl.startsWith('https://')))process.exit(1)
          if(x.items.some((v,i)=>v.sourceType==='live'&&x.items.slice(0,i).some(p=>p.sourceType==='video')))process.exit(1)
          console.log('Verified LIVE/VOD records:',x.items.length)
          JS
      - name: Publish JSON to QA Pages repository
        run: |
          cp /tmp/worldwide-live-PL.json worldwide-live-PL.json
          if git diff --quiet -- worldwide-live-PL.json && git ls-files --error-unmatch worldwide-live-PL.json >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worldwide-live-PL.json
          git commit -m 'data(qa): sync reviewed WORLDWIDE LIVE/VOD metadata'
          git push
